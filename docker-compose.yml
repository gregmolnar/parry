# Services for the test suite, one per storage backend it runs against:
#
#   bundle exec rake test:redis      # redis
#   bundle exec rake test:postgres   # postgres, or any PostgreSQL server on 5432
#   bundle exec rake test:mysql      # mysql
#   bundle exec rake test            # SQLite, needs none of these
#
# Redis and MySQL are moved off the default ports so they do not clash with a
# local server. PostgreSQL keeps 5432 and is opt-in, for machines that do not
# run one already:
#
#   docker compose --profile postgres up -d
services:
  redis:
    image: redis:7-alpine
    # Parry's rules are data, not cache: keep them on disk and outside the
    # container, so recreating it does not wipe them.
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - ./tmp/redis:/data

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: parry_test
      # Test-only server, reachable from this machine only.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./tmp/postgres:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: parry
      MYSQL_DATABASE: parry_test
    ports:
      - "3307:3306"
    volumes:
      - ./tmp/mysql:/var/lib/mysql
